name: Qoder Daily

on:
  # 上游仓库默认不跑定时，避免空跑。
  # fork 后想启用定时：把下面两行取消注释（cron 用 UTC，北京时间 = UTC+8）。
  # 北京时间 每天 08:20
  # schedule:
  #   - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Qoder-Daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      # Credential-bearing state must not enter a public/fork-readable cache.
      - name: Restore token state (private default branch only)
        id: token-state
        if: github.event.repository.private == true && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/restore@v4
        with:
          path: |
            qoder_tokens.json
            qoder_machine_id
          key: qoder-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: qoder-state-v1-

      - name: Run Qoder Daily
        env:
          QODER_TOKENS: ${{ secrets.QODER_TOKENS }}
          QODER_GLOBAL_TOKENS: ${{ secrets.QODER_GLOBAL_TOKENS }}
          QODER_MACHINE_TOKEN: ${{ secrets.QODER_MACHINE_TOKEN }}
          QODER_MACHINE_CODE: ${{ secrets.QODER_MACHINE_CODE }}
          QODER_MACHINE_TYPE: ${{ secrets.QODER_MACHINE_TYPE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python qoder_daily.py

      # Refresh may succeed before a later request fails; retain rotated tokens.
      - name: Save token state (private default branch only)
        if: always() && steps.token-state.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            qoder_tokens.json
            qoder_machine_id
          key: qoder-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

